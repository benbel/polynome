name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r build/requirements.txt

      - name: Build audio assets
        run: cd build && python build.py

      # The page animates silently when the assets are missing, so make an
      # empty build fail here instead of shipping a mute site.
      - name: Verify assets
        run: |
          for mode in original texture clear voices speech; do
            test -f "assets/$mode/manifest.json" || { echo "missing assets/$mode/manifest.json"; exit 1; }
            count=$(ls assets/$mode/*.ogg 2>/dev/null | wc -l)
            [ "$count" -gt 0 ] || { echo "no audio files in assets/$mode"; exit 1; }
            echo "assets/$mode: $count files"
          done

      # enablement:true lets the workflow switch Pages to "GitHub Actions" —
      # without it the deploy fails with "Get Pages site failed" whenever the
      # repo is still set to publish from a branch (which serves no assets,
      # since assets/ is gitignored).
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
