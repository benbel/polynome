<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>polyrhythm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;background:#fcfcfc;font-family:'Courier New',monospace;
  user-select:none;-webkit-user-select:none;}
#loading{color:#ccc;font-size:11px;letter-spacing:2px;text-transform:uppercase;}
#main{display:none;flex-direction:column;align-items:center;}
#outer{display:flex;gap:10px;align-items:flex-start;padding:20px;}
#pat-col{display:flex;flex-direction:column;gap:4px;padding-top:28px;}
.pat-btn{width:20px;height:20px;font-family:'Courier New',monospace;font-size:9px;
  background:transparent;border:1px solid #e0e0e0;border-radius:4px;
  cursor:pointer;color:#ccc;text-align:center;line-height:20px;transition:all .15s;}
.pat-btn.sel{color:#999;border-color:#bbb;background:rgba(255,225,180,.5);}
#content{display:flex;flex-direction:column;gap:16px;}
#stage{display:inline-grid;gap:24px;justify-items:center;}
.panel{display:flex;flex-direction:column;align-items:center;}
.grid{display:inline-grid;gap:2px;}
.inst{margin-bottom:6px;display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.inst button{font-family:'Courier New',monospace;font-size:9px;letter-spacing:1px;
  text-transform:uppercase;background:transparent;border:1px solid #ddd;
  border-radius:6px;padding:3px 8px;cursor:pointer;color:#aaa;transition:all .1s;}
.inst button.sel{color:#888;border-color:#bbb;background:rgba(240,235,225,.6);}
#mel-wrap{display:flex;flex-direction:column;align-items:center;border-top:1px solid #eee;padding-top:12px;}
#mel-grids{display:flex;gap:16px;}
#controls{display:flex;align-items:center;gap:11px;margin-top:14px;
  color:#bbb;font-size:10px;letter-spacing:2px;text-transform:uppercase;flex-wrap:wrap;justify-content:center;}
#controls span{cursor:pointer;}
input[type=range]{-webkit-appearance:none;appearance:none;width:80px;height:1px;background:#ccc;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:#aaa;border-radius:0;cursor:pointer;}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:#aaa;border:none;border-radius:0;cursor:pointer;}
</style>
</head>
<body>
<div id="loading">click to start</div>
<div id="main">
  <div id="outer">
    <div id="pat-col"></div>
    <div id="content">
      <div id="stage"></div>
      <div id="mel-wrap">
        <div class="inst" id="mel-inst-bar"></div>
        <div id="mel-grids"></div>
      </div>
    </div>
  </div>
  <div id="controls">
    <span id="ctl"></span>
    <span onclick="resetAll()">✕</span>
    <span onclick="randomize()">⚄</span>
    <span onclick="saveSong()">↓</span>
    <span onclick="loadSong()">↑</span>
    <input type="range" id="speed" min="50" max="500" value="200"><span id="bpm"></span>
    <span id="cycleToggle" onclick="toggleCycle()">⟳ off</span>
    <input type="range" id="cycleLen" min="16" max="256" value="64" step="8"><span id="cycleDisp"></span>
    <span>×</span><input type="range" id="melN" min="1" max="8" value="2"><span id="melNDisp"></span>
  </div>
</div>
<script>
var LAYOUT_COLS=2;
var GRID_DEFS=[
  {instrument:'glass',rows:16,cols:32},{instrument:'fm',rows:16,cols:32},
  {instrument:'sub',rows:16,cols:32},{instrument:'dust',rows:16,cols:32},
];
var MEL_ROWS=8,MEL_TOTAL_COLS=64,MEL_GRID_COLS=32,CELL=16,SR=44100,NUM_PATTERNS=8;
var FREQS_ALL=[262,220,196,165,131,110,98,82,73,65,55,49,41,33,27,21];
var MEL_FREQS=[523,440,392,330,262,220,196,165];

var S_OFF={bg:'transparent',border:'#ebebeb',shadow:'none'};
var S_LIT={bg:'rgba(255,228,188,.55)',border:'rgba(248,215,170,.65)',shadow:'0 0 8px 2px rgba(255,222,175,.4)'};
var S_HALF={bg:'rgba(255,220,170,.7)',border:'rgba(242,200,148,.8)',shadow:'0 0 10px 3px rgba(255,218,165,.5)'};
var S_FULL={bg:'rgb(255,215,160)',border:'rgb(240,195,135)',shadow:'0 0 14px 4px rgba(255,218,165,.7), 0 0 28px 8px rgba(255,212,155,.25)'};
var S_TRIG={bg:'rgb(250,205,145)',border:'rgb(235,185,120)',shadow:'0 0 18px 5px rgba(255,210,150,.85), 0 0 36px 10px rgba(250,205,140,.35)'};

var MAIN_INSTS=[{id:'sub',label:'sub'},{id:'fm',label:'fm'},{id:'glass',label:'glass'},{id:'tape',label:'tape'},{id:'dust',label:'dust'}];
var MEL_INST_LIST=[{id:'pad',label:'pad'},{id:'organ',label:'organ'},{id:'piano',label:'piano'}];

var INST_FX={sub:{delay:.06,reverb:.10,gain:.34},fm:{delay:.18,reverb:.25,gain:.22},glass:{delay:.28,reverb:.40,gain:.20},tape:{delay:.22,reverb:.35,gain:.20},dust:{delay:.14,reverb:.22,gain:.28},pad:{delay:.25,reverb:.50,gain:.16},organ:{delay:.18,reverb:.30,gain:.18},piano:{delay:.22,reverb:.38,gain:.20}};
var INST_DUR={sub:2.0,fm:2.2,glass:2.6,tape:2.4,dust:1.2,pad:3.5,organ:2.8,piano:2.4};

var ctx=null,step=0,timer=null,playing=false,stepMs=200;
var grids=[],buffers={};
var melCells=[],melActive={},melInstrument='pad',melButtons=[],melN=2;
var delayInputNode=null,reverbInputNode=null,masterComp=null;
var patterns=[],currentPattern=0,autoCycle=false,cycleSteps=64,patButtons=[];
var TR_STEPS=16,trRem=0,oldActives=[],oldInsts=[];
var oldMelActive={},oldMelInst='pad';

for(var i=0;i<NUM_PATTERNS;i++){
  patterns[i]={grids:[],melody:{cells:{},instrument:'pad'}};
  for(var gi=0;gi<GRID_DEFS.length;gi++)patterns[i].grids[gi]={cells:{},instrument:GRID_DEFS[gi].instrument};
}

function aS(el,s){el.style.background=s.bg;el.style.borderColor=s.border;el.style.boxShadow=s.shadow;}

// ======================== PATTERN IO ========================
function savePat(idx){
  for(var gi=0;gi<grids.length;gi++){var g=grids[gi],c={},k=Object.keys(g.active);
    for(var i=0;i<k.length;i++)c[k[i]]=g.active[k[i]].vol;
    patterns[idx].grids[gi]={cells:c,instrument:g.instrument};}
  var mc={},mk=Object.keys(melActive);
  for(var i=0;i<mk.length;i++)mc[mk[i]]=melActive[mk[i]].vol;
  patterns[idx].melody={cells:mc,instrument:melInstrument};
}

function loadPat(idx){
  oldActives=[];oldInsts=[];
  for(var gi=0;gi<grids.length;gi++){var g=grids[gi];oldActives[gi]={};oldInsts[gi]=g.instrument;
    var k=Object.keys(g.active);for(var i=0;i<k.length;i++)oldActives[gi][k[i]]={offset:g.active[k[i]].offset,vol:g.active[k[i]].vol};}
  oldMelActive={};oldMelInst=melInstrument;
  var om=Object.keys(melActive);for(var i=0;i<om.length;i++)oldMelActive[om[i]]={vol:melActive[om[i]].vol};
  trRem=TR_STEPS;

  for(var gi=0;gi<grids.length;gi++){var g=grids[gi],pat=patterns[idx].grids[gi];
    g.active={};g.instrument=pat.instrument;
    for(var b=0;b<g.buttons.length;b++)g.buttons[b].className=g.buttons[b].dataset.inst===g.instrument?'sel':'';
    var k=Object.keys(pat.cells);
    for(var i=0;i<k.length;i++){var ky=k[i],pts=ky.split('-'),c=parseInt(pts[1]),period=g.cols-c;
      g.active[ky]={offset:step-(g.cols-1)-Math.floor(Math.random()*period),vol:pat.cells[ky]};}
    for(var r=0;r<g.rows;r++)for(var c=0;c<g.cols;c++){var a=g.active[r+'-'+c];
      aS(g.cells[r][c],a?(a.vol>=1?S_FULL:S_HALF):S_OFF);}
  }
  var mp=patterns[idx].melody;melActive={};melInstrument=mp.instrument;
  for(var b=0;b<melButtons.length;b++)melButtons[b].className=melButtons[b].dataset.inst===melInstrument?'sel':'';
  var mk2=Object.keys(mp.cells);for(var i=0;i<mk2.length;i++)melActive[mk2[i]]={vol:mp.cells[mk2[i]]};
  for(var r=0;r<MEL_ROWS;r++)for(var c=0;c<MEL_TOTAL_COLS;c++){var a=melActive[r+'-'+c];
    aS(melCells[r][c],a?(a.vol>=1?S_FULL:S_HALF):S_OFF);}
  currentPattern=idx;updatePatBtns();
}

function selectPat(idx){savePat(currentPattern);loadPat(idx);}
function updatePatBtns(){for(var i=0;i<patButtons.length;i++)patButtons[i].className=i===currentPattern?'pat-btn sel':'pat-btn';}

// ======================== AUDIO ========================
function normalize(b,p){var m=0;for(var c=0;c<b.numberOfChannels;c++){var d=b.getChannelData(c);for(var i=0;i<d.length;i++){var a=Math.abs(d[i]);if(a>m)m=a;}}if(m>0){var s=p/m;for(var c=0;c<b.numberOfChannels;c++){var d=b.getChannelData(c);for(var i=0;i<d.length;i++)d[i]*=s;}}}
function bitcrush(b,bits,dn){var s=Math.pow(2,-(bits-1));for(var c=0;c<b.numberOfChannels;c++){var d=b.getChannelData(c);var h=0;for(var i=0;i<d.length;i++){if(i%dn===0)h=Math.round(d[i]/s)*s;d[i]=h;}}}
function tapeSat(b,dr){for(var c=0;c<b.numberOfChannels;c++){var d=b.getChannelData(c);for(var i=0;i<d.length;i++){var x=d[i]*dr;d[i]=x>0?Math.tanh(x*1.2)/1.2:Math.tanh(x*0.9)/0.9;}}}
function fadeIn(b,ms){var n=Math.round(b.sampleRate*ms/1000);for(var c=0;c<b.numberOfChannels;c++){var d=b.getChannelData(c);for(var i=0;i<n&&i<d.length;i++)d[i]*=i/n;}}
function fadeOut(b,ms){var n=Math.round(b.sampleRate*ms/1000);for(var c=0;c<b.numberOfChannels;c++){var d=b.getChannelData(c);var s=d.length-n;for(var i=Math.max(0,s);i<d.length;i++)d[i]*=(d.length-i)/n;}}
function mkDist(a){var n=1024,c=new Float32Array(n);for(var i=0;i<n;i++){var x=(i*2/n)-1;c[i]=Math.tanh(x*a);}return c;}
function mkFold(f){var n=2048,c=new Float32Array(n);for(var i=0;i<n;i++){var x=((i*2/n)-1)*f;c[i]=(4/Math.PI)*Math.asin(Math.sin(Math.PI*x/2));}return c;}
function nBuf(oc,dur){var l=Math.round(oc.sampleRate*dur);var b=oc.createBuffer(1,l,oc.sampleRate);var d=b.getChannelData(0);for(var i=0;i<l;i++)d[i]=Math.random()*2-1;return b;}
function sNoise(oc,dur){var l=Math.round(oc.sampleRate*dur);var b=oc.createBuffer(2,l,oc.sampleRate);for(var c=0;c<2;c++){var d=b.getChannelData(c);for(var i=0;i<l;i++)d[i]=Math.random()*2-1;}return b;}

// ======================== INSTRUMENTS ========================
function renderSub(f0,oc){var f=f0*0.25,dur=INST_DUR.sub;var out=oc.createGain();out.gain.setValueAtTime(0.9,0);out.gain.linearRampToValueAtTime(0.7,0.06);out.gain.exponentialRampToValueAtTime(0.001,dur-0.1);out.connect(oc.destination);var lp=oc.createBiquadFilter();lp.type='lowpass';lp.Q.value=12;lp.frequency.setValueAtTime(f*16,0);lp.frequency.exponentialRampToValueAtTime(f*2,0.3);lp.frequency.exponentialRampToValueAtTime(f*1.3,1.0);lp.connect(out);var lp2=oc.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=f*8;lp2.Q.value=2;lp2.connect(lp);var w=oc.createOscillator();w.type='triangle';w.frequency.value=0.9;var wG=oc.createGain();wG.gain.value=f*1.5;w.connect(wG);wG.connect(lp.frequency);w.start(0);w.stop(dur);var n=2048,fc=new Float32Array(n);for(var i=0;i<n;i++){var x=((i*2/n)-1)*3;var fd=(4/Math.PI)*Math.asin(Math.sin(Math.PI*x/2));fc[i]=x>0?fd*0.85:fd;}var fold=oc.createWaveShaper();fold.curve=fc;fold.oversample='4x';var sat=oc.createWaveShaper();sat.curve=mkDist(6);sat.oversample='4x';fold.connect(sat);sat.connect(lp2);var mx=oc.createGain();mx.gain.value=0.4;mx.connect(fold);var dts=[-28,-18,-8,-3,3,8,18,28],pns=[-0.9,-0.6,-0.3,-0.1,0.1,0.3,0.6,0.9];var dR=[0.13,0.09,0.17,0.11,0.14,0.08,0.16,0.1],dA=[1.5,2.2,1.8,2.5,1.6,2.0,1.9,2.3];for(var i=0;i<8;i++){var o=oc.createOscillator();o.type=i<4?'sawtooth':'square';o.frequency.value=f;o.detune.value=dts[i];var dr=oc.createOscillator();dr.type='sine';dr.frequency.value=dR[i];var dg=oc.createGain();dg.gain.value=dA[i];dr.connect(dg);dg.connect(o.detune);var g=oc.createGain();g.gain.value=i<4?0.14:0.1;var p=oc.createStereoPanner();p.pan.value=pns[i];o.connect(g).connect(p).connect(mx);o.start(0);o.stop(dur);dr.start(0);dr.stop(dur);}var sub=oc.createOscillator();sub.type='sine';sub.frequency.value=f;var rL=oc.createOscillator();rL.type='sine';rL.frequency.value=0.25;var rG=oc.createGain();rG.gain.value=0;rL.connect(rG.gain);var sB=oc.createGain();sB.gain.value=0.5;sub.connect(sB).connect(lp2);sub.connect(rG).connect(lp2);sub.start(0);sub.stop(dur);rL.start(0);rL.stop(dur);var hm=oc.createOscillator();hm.type='sine';hm.frequency.value=50;var hG=oc.createGain();hG.gain.value=0.06;hm.connect(hG).connect(out);hm.start(0);hm.stop(dur);var md=oc.createOscillator();md.type='square';md.frequency.value=f*2;var mg=oc.createGain();mg.gain.setValueAtTime(f*4,0);mg.gain.exponentialRampToValueAtTime(1,0.3);md.connect(mg);mg.connect(lp.frequency);md.start(0);md.stop(0.35);var nb=nBuf(oc,0.5);var ns=oc.createBufferSource();ns.buffer=nb;var nf=oc.createWaveShaper();nf.curve=mkFold(2);var nl=oc.createBiquadFilter();nl.type='lowpass';nl.frequency.value=f*8;nl.Q.value=3;var ng=oc.createGain();ng.gain.setValueAtTime(0.35,0);ng.gain.exponentialRampToValueAtTime(0.001,0.4);ns.connect(nf).connect(nl).connect(ng).connect(sat);ns.start(0);}

function renderFm(f0,oc){var f=f0,dur=INST_DUR.fm;var out=oc.createGain();out.gain.setValueAtTime(0.8,0);out.gain.exponentialRampToValueAtTime(0.001,dur-0.1);out.connect(oc.destination);var lp=oc.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(f*6,0);lp.frequency.exponentialRampToValueAtTime(f*1.2,0.8);lp.Q.value=5;lp.connect(out);var ct=Math.min(1/(f*1.5),0.05);var cm=oc.createDelay(0.05);cm.delayTime.value=ct;var cf=oc.createGain();cf.gain.value=0.55;var cl=oc.createBiquadFilter();cl.type='lowpass';cl.frequency.value=f*3;cl.connect(cm);cm.connect(cf).connect(cl);var ci=oc.createGain();ci.gain.value=0.25;ci.connect(cm);cm.connect(lp);var n2=2048,fc2=new Float32Array(n2);for(var i=0;i<n2;i++){var x=((i*2/n2)-1)*1.8;var fd=(4/Math.PI)*Math.asin(Math.sin(Math.PI*x/2));fc2[i]=x>0?fd*0.8:fd*1.1;}var fold=oc.createWaveShaper();fold.curve=fc2;fold.oversample='2x';fold.connect(lp);fold.connect(ci);var car=oc.createOscillator();car.type='sine';car.frequency.value=f;var cd1=oc.createOscillator();cd1.type='sine';cd1.frequency.value=0.11;var cd1g=oc.createGain();cd1g.gain.value=1.5;cd1.connect(cd1g);cd1g.connect(car.detune);var cg=oc.createGain();cg.gain.value=0.55;var cp=oc.createStereoPanner();cp.pan.value=-0.35;car.connect(cg).connect(cp).connect(fold);var car2=oc.createOscillator();car2.type='sine';car2.frequency.value=f*1.005;var cd2=oc.createOscillator();cd2.type='sine';cd2.frequency.value=0.08;var cd2g=oc.createGain();cd2g.gain.value=2;cd2.connect(cd2g);cd2g.connect(car2.detune);var cg2=oc.createGain();cg2.gain.value=0.4;var cp2=oc.createStereoPanner();cp2.pan.value=0.35;car2.connect(cg2).connect(cp2).connect(fold);var m1=oc.createOscillator();m1.type='sine';m1.frequency.value=f*1.4142;var m1g=oc.createGain();m1g.gain.setValueAtTime(f*4,0);m1g.gain.exponentialRampToValueAtTime(f*0.2,0.9);m1.connect(m1g);m1g.connect(car.frequency);m1g.connect(car2.frequency);var m2=oc.createOscillator();m2.type='sine';m2.frequency.value=f*1.618;var m2g=oc.createGain(); // PIANO — hammer+string model. Noise exciter, comb resonators, multi-stage decay
function renderPiano(f0,oc){var f=f0,dur=INST_DUR.piano;var out=oc.createGain();out.gain.setValueAtTime(0.9,0);out.gain.linearRampToValueAtTime(0.7,0.01);out.gain.exponentialRampToValueAtTime(0.001,dur-0.1);out.connect(oc.destination);var lp=oc.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(f*6,0);lp.frequency.exponentialRampToValueAtTime(f*2,0.5);lp.Q.value=1;lp.connect(out);var c1d=Math.min(1/f,0.05);var c1=oc.createDelay(0.05);c1.delayTime.value=c1d;var c1f=oc.createGain();c1f.gain.value=0.92;var c1l=oc.createBiquadFilter();c1l.type='lowpass';c1l.frequency.value=f*4;c1.connect(c1f).connect(c1l).connect(c1);var c1o=oc.createGain();c1o.gain.setValueAtTime(0.4,0);c1o.gain.exponentialRampToValueAtTime(0.001,dur-0.2);c1.connect(c1o).connect(lp);var c2d=Math.min(1/(f*2.01),0.05);var c2=oc.createDelay(0.05);c2.delayTime.value=c2d;var c2f=oc.createGain();c2f.gain.value=0.88;var c2l=oc.createBiquadFilter();c2l.type='lowpass';c2l.frequency.value=f*3;c2.connect(c2f).connect(c2l).connect(c2);var c2o=oc.createGain();c2o.gain.setValueAtTime(0.2,0);c2o.gain.exponentialRampToValueAtTime(0.001,dur*0.5);var c2p=oc.createStereoPanner();c2p.pan.value=0.3;c2.connect(c2o).connect(c2p).connect(lp);var exc=nBuf(oc,0.008);var es=oc.createBufferSource();es.buffer=exc;var eg=oc.createGain();eg.gain.value=0.7;var eh=oc.createBiquadFilter();eh.type='bandpass';eh.frequency.value=f*2;eh.Q.value=2;es.connect(eh).connect(eg);eg.connect(c1);eg.connect(c2);es.start(0);var thump=oc.createOscillator();thump.type='sine';thump.frequency.setValueAtTime(f*1.5,0);thump.frequency.exponentialRampToValueAtTime(f,0.02);var tg=oc.createGain();tg.gain.setValueAtTime(0.15,0);tg.gain.exponentialRampToValueAtTime(0.001,0.04);thump.connect(tg).connect(lp);thump.start(0);thump.stop(0.05);var sn=sNoise(oc,0.3);var sns=oc.createBufferSource();sns.buffer=sn;var snl=oc.createBiquadFilter();snl.type='bandpass';snl.frequency.value=f*3;snl.Q.value=3;var sng=oc.createGain();sng.gain.setValueAtTime(0.05,0);sng.gain.exponentialRampToValueAtTime(0.001,0.25);sns.connect(snl).connect(sng).connect(lp);sns.start(0);}

var RENDERERS={sub:renderSub,fm:renderFm,glass:renderGlass,tape:renderTape,dust:renderDust,pad:renderPad,organ:renderOrgan,piano:renderPiano};
var CRUSH={sub:{bits:8,down:5,tape:2.5},fm:{bits:10,down:3,tape:2.0},glass:{bits:11,down:2,tape:1.6},tape:{bits:10,down:4,tape:2.8},dust:{bits:9,down:3,tape:2.0},pad:{bits:10,down:3,tape:1.8},organ:{bits:12,down:2,tape:1.4},piano:{bits:13,down:1,tape:1.2}};
var FADE_IN_MS={sub:40,fm:30,glass:20,tape:35,dust:8,pad:60,organ:15,piano:5};
var FADE_OUT_MS={sub:80,fm:60,glass:50,tape:70,dust:20,pad:120,organ:40,piano:30};
// melody instruments get aggressive fade
var MEL_FADE_IN=8,MEL_FADE_OUT=80;

async function prerenderAll(){
  var maxF=0;for(var gi=0;gi<GRID_DEFS.length;gi++){if(GRID_DEFS[gi].rows>maxF)maxF=GRID_DEFS[gi].rows;}
  var freqs=FREQS_ALL.slice(0,maxF);
  var promises=[],allInsts=Object.keys(RENDERERS);
  for(var ii=0;ii<allInsts.length;ii++){var id=allInsts[ii];
    var fList=(id==='pad'||id==='organ'||id==='piano')?MEL_FREQS:freqs;
    buffers[id]=new Array(fList.length);
    for(var fi=0;fi<fList.length;fi++){
      (function(id,fi,freq){var dur=INST_DUR[id];var len=Math.round(SR*dur);
        var oc=new OfflineAudioContext(2,len,SR);RENDERERS[id](freq,oc);var cr=CRUSH[id];
        var isMel=(id==='pad'||id==='organ'||id==='piano');
        promises.push(oc.startRendering().then(function(buf){
          if(cr.tape>1)tapeSat(buf,cr.tape);
          if(cr.down>1||cr.bits<16)bitcrush(buf,cr.bits,cr.down);
          normalize(buf,0.85);
          fadeIn(buf,isMel?MEL_FADE_IN:FADE_IN_MS[id]);
          fadeOut(buf,isMel?MEL_FADE_OUT:FADE_OUT_MS[id]);
          buffers[id][fi]=buf;
        }));
      })(id,fi,fList[fi]);
    }
  }
  await Promise.all(promises);
}

function buildFx(){
  masterComp=ctx.createDynamicsCompressor();masterComp.threshold.value=-12;masterComp.knee.value=4;masterComp.ratio.value=8;masterComp.attack.value=0.002;masterComp.release.value=0.12;masterComp.connect(ctx.destination);
  var irL=Math.round(ctx.sampleRate*3.5);var irB=ctx.createBuffer(2,irL,ctx.sampleRate);
  for(var ch=0;ch<2;ch++){var d=irB.getChannelData(ch);for(var i=0;i<irL;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/irL,2.5);for(var i=1;i<irL;i++)d[i]=d[i]*0.2+d[i-1]*0.8;}
  var cv=ctx.createConvolver();cv.buffer=irB;var rW=ctx.createGain();rW.gain.value=0.22;
  reverbInputNode=ctx.createGain();reverbInputNode.gain.value=1;reverbInputNode.connect(cv);cv.connect(rW).connect(masterComp);
  var dL=ctx.createDelay(2);dL.delayTime.value=0.45;var dR=ctx.createDelay(2);dR.delayTime.value=0.3;
  var fbL=ctx.createGain();fbL.gain.value=0.4;var fbR=ctx.createGain();fbR.gain.value=0.4;
  var fL1=ctx.createBiquadFilter();fL1.type='lowpass';fL1.frequency.value=1200;
  var fL2=ctx.createBiquadFilter();fL2.type='lowpass';fL2.frequency.value=1200;
  var pL=ctx.createStereoPanner();pL.pan.value=-0.75;var pR=ctx.createStereoPanner();pR.pan.value=0.75;
  var dW=ctx.createGain();dW.gain.value=0.24;
  delayInputNode=ctx.createGain();delayInputNode.gain.value=1;delayInputNode.connect(dL);
  dL.connect(fbL).connect(fL1).connect(dR);dR.connect(fbR).connect(fL2).connect(dL);
  dL.connect(pL).connect(dW);dR.connect(pR).connect(dW);dW.connect(masterComp);dW.connect(reverbInputNode);
}

function playNote(inst,fi,vol,time){
  var buf=buffers[inst];if(!buf||!buf[fi])return;buf=buf[fi];
  var fx=INST_FX[inst];var src=ctx.createBufferSource();src.buffer=buf;var v=fx.gain*vol;
  var dry=ctx.createGain();dry.gain.value=v;src.connect(dry).connect(masterComp);
  var ds=ctx.createGain();ds.gain.value=fx.delay*v;src.connect(ds).connect(delayInputNode);
  var rs=ctx.createGain();rs.gain.value=fx.reverb*v;src.connect(rs).connect(reverbInputNode);
  src.start(time);
}

// ======================== RANDOM ========================
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function randInt(lo,hi){return lo+Math.floor(Math.random()*(hi-lo+1));}
function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
function cloneC(c){var r={};var k=Object.keys(c);for(var i=0;i<k.length;i++)r[k[i]]=c[k[i]];return r;}

function genSeed(gi,isMel,cols,rows){
  var cp=[3,5,7,9,11,13,17,19],an=[4,6,8,12,16];
  var mI=['glass','fm','tape'],rI=['sub','dust'];
  var inst=pick(isMel?mI:rI),cells={},aR=range(rows);
  if(isMel){var nV=randInt(2,4),rw=shuffle(aR).slice(0,nV),pr=shuffle(cp).slice(0,nV);
    for(var i=0;i<nV;i++){var p=pr[i];if(p>cols)continue;cells[rw[i]+'-'+(cols-p)]=Math.random()>0.4?1:0.5;}}
  else{var nA=randInt(1,2),lR=shuffle(aR.slice(Math.floor(rows/2))).slice(0,nA),aP=shuffle(an).slice(0,nA);
    for(var i=0;i<nA;i++){var p=aP[i];if(p>cols)continue;cells[lR[i]+'-'+(cols-p)]=1;}
    var nC=randInt(1,2),hR=shuffle(aR.slice(0,Math.floor(rows/2))).slice(0,nC);
    for(var i=0;i<nC;i++){var p=pick(cp.filter(function(p){return p<=cols;}));cells[hR[i]+'-'+(cols-p)]=Math.random()>0.5?1:0.5;}}
  return{cells:cells,instrument:inst};
}

function mutAdd(c,cols,rows){var r=cloneC(c);var cp=[3,5,7,9,11,13,17,19];for(var i=0;i<randInt(1,2);i++){var ro=randInt(0,rows-1),p=pick(cp.filter(function(p){return p<=cols;}));var k=ro+'-'+(cols-p);if(!r[k])r[k]=Math.random()>0.5?1:0.5;}return r;}
function mutRm(c){var r=cloneC(c);var k=Object.keys(r);if(k.length<=1)return r;var n=Math.min(randInt(1,2),k.length-1);var rm=shuffle(k).slice(0,n);for(var i=0;i<rm.length;i++)delete r[rm[i]];return r;}
function mutShift(c,rows,dir){var r={};var sh=dir*randInt(1,2);var k=Object.keys(c);for(var i=0;i<k.length;i++){var p=k[i].split('-');var nr=parseInt(p[0])+sh;if(nr>=0&&nr<rows)r[nr+'-'+p[1]]=c[k[i]];}return r;}
function mutVol(c){var r=cloneC(c);var k=Object.keys(r);var n=Math.max(1,Math.floor(k.length/2));var t=shuffle(k).slice(0,n);for(var i=0;i<t.length;i++)r[t[i]]=r[t[i]]>=1?0.5:1;return r;}
function mutDense(c,cols,rows){var r=mutAdd(mutAdd(cloneC(c),cols,rows),cols,rows);var k=Object.keys(c);for(var i=0;i<k.length;i++)r[k[i]]=1;var cp=[3,5,7,9,11,13];for(var i=0;i<randInt(1,2);i++){var ro=randInt(0,rows-1),p=pick(cp.filter(function(p){return p<=cols;}));var ky=ro+'-'+(cols-p);if(!r[ky])r[ky]=0.5;}return r;}

function genMelSeed(){
  var cells={},scale=[0,2,3,5,7]; // rows on pentatonic
  var pos=0,noteLen=randInt(1,3);
  while(pos<MEL_TOTAL_COLS){
    if(Math.random()>0.3){var row=pick(scale);cells[row+'-'+pos]=Math.random()>0.4?1:0.5;}
    pos+=randInt(1,noteLen+1);
  }
  return cells;
}

function mutMel(c){
  var r=cloneC(c);var k=Object.keys(r);
  // shift some notes ±1 row, add/remove some
  for(var i=0;i<k.length;i++){
    if(Math.random()>0.7){delete r[k[i]];continue;}
    if(Math.random()>0.6){var p=k[i].split('-');var nr=parseInt(p[0])+pick([-1,1]);if(nr>=0&&nr<MEL_ROWS){delete r[k[i]];r[nr+'-'+p[1]]=c[k[i]];}}
  }
  // add a few new notes
  for(var i=0;i<randInt(1,4);i++){var ro=randInt(0,MEL_ROWS-1),co=randInt(0,MEL_TOTAL_COLS-1);if(!r[ro+'-'+co])r[ro+'-'+co]=Math.random()>0.5?1:0.5;}
  return r;
}

function genRelated(){
  var melSeed=genMelSeed();var melInst=pick(['pad','organ','piano']);
  for(var gi=0;gi<GRID_DEFS.length;gi++){
    var def=GRID_DEFS[gi],isMel=gi<Math.ceil(GRID_DEFS.length/2);
    var seed=genSeed(gi,isMel,def.cols,def.rows);
    var k0=cloneC(seed.cells);var kk=Object.keys(k0);for(var i=0;i<kk.length;i++)k0[kk[i]]=0.5;
    patterns[0].grids[gi]={cells:k0,instrument:seed.instrument};
    patterns[1].grids[gi]={cells:cloneC(seed.cells),instrument:seed.instrument};
    patterns[2].grids[gi]={cells:mutAdd(seed.cells,def.cols,def.rows),instrument:seed.instrument};
    patterns[3].grids[gi]={cells:mutVol(mutShift(seed.cells,def.rows,pick([-1,1]))),instrument:seed.instrument};
    patterns[4].grids[gi]={cells:mutDense(seed.cells,def.cols,def.rows),instrument:seed.instrument};
    var aI=isMel?['glass','fm','tape']:['sub','dust'];var alt=pick(aI.filter(function(x){return x!==seed.instrument;}));
    patterns[5].grids[gi]={cells:mutShift(seed.cells,def.rows,pick([-1,1])),instrument:alt||seed.instrument};
    var bk=mutRm(mutRm(seed.cells));var bkk=Object.keys(bk);for(var i=0;i<bkk.length;i++)bk[bkk[i]]=0.5;
    patterns[6].grids[gi]={cells:bk,instrument:seed.instrument};
    var cl=mutDense(mutAdd(seed.cells,def.cols,def.rows),def.cols,def.rows);var ck=Object.keys(cl);for(var i=0;i<ck.length;i++)cl[ck[i]]=1;
    patterns[7].grids[gi]={cells:cl,instrument:seed.instrument};
  }
  // melody patterns
  patterns[0].melody={cells:{},instrument:melInst}; // intro: no melody
  patterns[1].melody={cells:cloneC(melSeed),instrument:melInst};
  patterns[2].melody={cells:cloneC(melSeed),instrument:melInst};
  patterns[3].melody={cells:mutMel(melSeed),instrument:melInst};
  patterns[4].melody={cells:mutMel(mutMel(melSeed)),instrument:melInst};
  var altMel=pick(MEL_INST_LIST.filter(function(x){return x.id!==melInst;}).map(function(x){return x.id;}));
  patterns[5].melody={cells:mutMel(melSeed),instrument:altMel};
  patterns[6].melody={cells:{},instrument:melInst}; // breakdown: no melody
  patterns[7].melody={cells:mutMel(mutMel(melSeed)),instrument:melInst};
}

function randomize(){if(playing)stop();step=0;genRelated();currentPattern=0;loadPat(0);start();}

function resetAll(){if(playing)stop();step=0;
  for(var gi=0;gi<grids.length;gi++){grids[gi].active={};for(var r=0;r<grids[gi].rows;r++)for(var c=0;c<grids[gi].cols;c++)aS(grids[gi].cells[r][c],S_OFF);}
  melActive={};for(var r=0;r<MEL_ROWS;r++)for(var c=0;c<MEL_TOTAL_COLS;c++)aS(melCells[r][c],S_OFF);
  for(var pi=0;pi<NUM_PATTERNS;pi++){for(var gi=0;gi<GRID_DEFS.length;gi++)patterns[pi].grids[gi]={cells:{},instrument:GRID_DEFS[gi].instrument};patterns[pi].melody={cells:{},instrument:'pad'};}
  currentPattern=0;updatePatBtns();updateCtl();
}

function saveSong(){savePat(currentPattern);var song={patterns:patterns,currentPattern:currentPattern,bpm:Math.round(60000/stepMs),cycleSteps:cycleSteps,autoCycle:autoCycle,melN:melN};var blob=new Blob([JSON.stringify(song)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='polyrhythm-song.json';a.click();URL.revokeObjectURL(a.href);}

function loadSong(){var inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.addEventListener('change',function(){if(!inp.files[0])return;var reader=new FileReader();reader.onload=function(){try{var s=JSON.parse(reader.result);if(!s.patterns)return;if(playing)stop();step=0;for(var pi=0;pi<NUM_PATTERNS;pi++){if(s.patterns[pi])patterns[pi]=s.patterns[pi];else{patterns[pi]={grids:[],melody:{cells:{},instrument:'pad'}};for(var gi=0;gi<GRID_DEFS.length;gi++)patterns[pi].grids[gi]={cells:{},instrument:GRID_DEFS[gi].instrument};}}if(s.bpm){stepMs=Math.round(60000/s.bpm);slider.value=550-stepMs;updateBpm();}if(s.cycleSteps){cycleSteps=s.cycleSteps;cycleSlider.value=cycleSteps;updateCycleDisp();}if(typeof s.autoCycle==='boolean'){autoCycle=s.autoCycle;document.getElementById('cycleToggle').textContent=autoCycle?'⟳ on':'⟳ off';}if(s.melN){melN=s.melN;melSlider.value=melN;updateMelN();}trRem=0;currentPattern=s.currentPattern||0;loadPat(currentPattern);}catch(e){console.error(e);}};reader.readAsText(inp.files[0]);});inp.click();}

  melGridsDiv.appendChild(gel);
}

function toggleMain(gi,r,c){var g=grids[gi];var k=r+'-'+c;
  if(!g.active[k]){g.active[k]={offset:step-(g.cols-1),vol:0.5};aS(g.cells[r][c],S_HALF);}
  else if(g.active[k].vol<1){g.active[k].vol=1;aS(g.cells[r][c],S_FULL);}
  else{delete g.active[k];aS(g.cells[r][c],S_OFF);}
  if(!playing)start();updateCtl();
}

function toggleMel(r,c){var k=r+'-'+c;
  if(!melActive[k]){melActive[k]={vol:0.5};aS(melCells[r][c],S_HALF);}
  else if(melActive[k].vol<1){melActive[k].vol=1;aS(melCells[r][c],S_FULL);}
  else{delete melActive[k];aS(melCells[r][c],S_OFF);}
  if(!playing)start();updateCtl();
}

function mod(a,n){return((a%n)+n)%n;}

function tick(){
  // auto-cycle
  if(autoCycle&&step>0&&step%cycleSteps===0){
    savePat(currentPattern);var next=(currentPattern+1)%NUM_PATTERNS;var ch=0;
    while(ch<NUM_PATTERNS){var any=false;for(var gi=0;gi<GRID_DEFS.length;gi++){if(Object.keys(patterns[next].grids[gi].cells).length>0)any=true;}
      if(Object.keys(patterns[next].melody.cells).length>0)any=true;if(any)break;next=(next+1)%NUM_PATTERNS;ch++;}
    if(ch<NUM_PATTERNS)loadPat(next);
  }

  var t=ctx.currentTime+0.02;
  var newV=1,oldV=0;
  if(trRem>0){var pr=1-(trRem/TR_STEPS);newV=pr*pr;oldV=(1-pr)*(1-pr);trRem--;
    if(oldV>0.01){for(var gi=0;gi<grids.length;gi++){var g=grids[gi];var oA=oldActives[gi];if(!oA)continue;var oI=oldInsts[gi];
      var k=Object.keys(oA);for(var i=0;i<k.length;i++){var pts=k[i].split('-');var r=parseInt(pts[0]),c=parseInt(pts[1]);
        var period=g.cols-c;var a=oA[k[i]];if(mod(step-a.offset-(g.cols-1),period)===0)playNote(oI,r,a.vol*oldV,t);}}
      // old melody
      var melStep=Math.floor(step/melN);var mc=mod(melStep,MEL_TOTAL_COLS);
      var omk=Object.keys(oldMelActive);for(var i=0;i<omk.length;i++){var pts=omk[i].split('-');if(parseInt(pts[1])===mc)playNote(oldMelInst,parseInt(pts[0]),oldMelActive[omk[i]].vol*oldV,t);}
    }
  }

  // main grids
  for(var gi=0;gi<grids.length;gi++){var g=grids[gi];var lit=[],trig=[];
    for(var r=0;r<g.rows;r++){lit[r]={};trig[r]=false;}
    var k=Object.keys(g.active);
    for(var i=0;i<k.length;i++){var pts=k[i].split('-');var r=parseInt(pts[0]),c=parseInt(pts[1]);
      var period=g.cols-c;var a=g.active[k[i]];
      if(mod(step-a.offset-(g.cols-1),period)===0){playNote(g.instrument,r,a.vol*newV,t);trig[r]=true;}
      for(var j=0;j<g.cols;j++){if(mod(step-a.offset-j,period)===0)lit[r][j]=true;}}
    for(var r=0;r<g.rows;r++){for(var c=0;c<g.cols;c++){
      var a=g.active[r+'-'+c];var isL=!!lit[r][c];var isT=trig[r]&&c===g.cols-1;
      if(isT&&isL)aS(g.cells[r][c],S_TRIG);
      else if(a&&a.vol>=1)aS(g.cells[r][c],S_FULL);
      else if(a)aS(g.cells[r][c],S_HALF);
      else if(isL)aS(g.cells[r][c],S_LIT);
      else aS(g.cells[r][c],S_OFF);}}
  }

  // melody grid — plays left to right, sound when cursor hits pressed button
  var melStep=Math.floor(step/melN);
  var mc=mod(melStep,MEL_TOTAL_COLS); // current melody column
  for(var r=0;r<MEL_ROWS;r++){
    for(var c=0;c<MEL_TOTAL_COLS;c++){
      var a=melActive[r+'-'+c];var isCursor=(c===mc);
      if(a&&isCursor){aS(melCells[r][c],S_TRIG);
        // play only on the exact step the cursor arrives
        if(step%melN===0)playNote(melInstrument,r,a.vol*newV,t);
      }else if(a&&a.vol>=1)aS(melCells[r][c],S_FULL);
      else if(a)aS(melCells[r][c],S_HALF);
      else if(isCursor)aS(melCells[r][c],S_LIT);
      else aS(melCells[r][c],S_OFF);
    }
  }
  step++;
}

function restartTimer(){if(timer)clearInterval(timer);if(playing)timer=setInterval(tick,stepMs);}
function start(){if(!ctx)return;playing=true;tick();timer=setInterval(tick,stepMs);updateCtl();}
function stop(){playing=false;if(timer)clearInterval(timer);timer=null;step=0;
  for(var gi=0;gi<grids.length;gi++){var g=grids[gi];for(var r=0;r<g.rows;r++)for(var c=0;c<g.cols;c++){
    var a=g.active[r+'-'+c];aS(g.cells[r][c],a?(a.vol>=1?S_FULL:S_HALF):S_OFF);}}
  for(var r=0;r<MEL_ROWS;r++)for(var c=0;c<MEL_TOTAL_COLS;c++){var a=melActive[r+'-'+c];aS(melCells[r][c],a?(a.vol>=1?S_FULL:S_HALF):S_OFF);}
  updateCtl();
}

var slider=document.getElementById('speed'),bpmEl=document.getElementById('bpm');
function updateBpm(){stepMs=550-parseInt(slider.value);bpmEl.textContent=Math.round(60000/stepMs)+' bpm';}
updateBpm();slider.addEventListener('input',function(){updateBpm();restartTimer();});

var cycleSlider=document.getElementById('cycleLen'),cycleDisp=document.getElementById('cycleDisp');
function updateCycleDisp(){cycleSteps=parseInt(cycleSlider.value);cycleDisp.textContent=cycleSteps+'st';}
updateCycleDisp();cycleSlider.addEventListener('input',updateCycleDisp);

var melSlider=document.getElementById('melN'),melNDisp=document.getElementById('melNDisp');
function updateMelN(){melN=parseInt(melSlider.value);melNDisp.textContent='×'+melN;}
updateMelN();melSlider.addEventListener('input',updateMelN);

function updateCtl(){var el=document.getElementById('ctl');var any=false;
  for(var gi=0;gi<grids.length;gi++){if(Object.keys(grids[gi].active).length>0)any=true;}
  if(Object.keys(melActive).length>0)any=true;
  if(playing)el.innerHTML='<span onclick="stop()">■</span>';
  else if(any)el.innerHTML='<span onclick="start()">▶</span>';
  else el.innerHTML='';}

async function init(){
  document.getElementById('loading').textContent='loading instruments...';
  ctx=new AudioContext();if(ctx.state==='suspended')await ctx.resume();
  buildFx();await prerenderAll();
  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='flex';}

document.addEventListener('click',function handler(){document.removeEventListener('click',handler);init();},{once:true});
</script>
